name: Temporary CloudSave 0.6.3 default-bundle integration
on:
  push:
    branches:
      - integrate/cloudsave-default-bundle
    paths:
      - .github/workflows/cloudsave-default-bundle.yml
permissions:
  actions: read
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the verified CloudSave 0.6.3 CI artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/wal-studio/wayward/actions/artifacts/15067791554/zip \
            -o /tmp/cloudsave-artifact.zip
          unzip -t /tmp/cloudsave-artifact.zip
      - name: Stage exact 0.6.3 files and patch the bundled mod archive
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from io import BytesIO
          import re, shutil

          required = {"mod.js", "crypto.js", "README.md", "INSTALL.txt"}

          def collect(zf):
              found = {}
              for name in zf.namelist():
                  if name.endswith("/"):
                      continue
                  base = PurePosixPath(name).name
                  if base in required:
                      if base in found:
                          raise SystemExit(f"Duplicate package member: {base}")
                      found[base] = zf.read(name)
              if set(found) == required:
                  return found
              for name in zf.namelist():
                  if name.lower().endswith(".zip"):
                      try:
                          with ZipFile(BytesIO(zf.read(name))) as nested:
                              result = collect(nested)
                              if set(result) == required:
                                  return result
                      except Exception:
                          pass
              raise SystemExit(f"CloudSave artifact missing members: {sorted(required - set(found))}")

          with ZipFile("/tmp/cloudsave-artifact.zip") as artifact:
              package = collect(artifact)

          stage = Path("/tmp/cloudsave-stage")
          if stage.exists():
              shutil.rmtree(stage)
          (stage / "cloud-save").mkdir(parents=True)
          for name, data in package.items():
              (stage / "cloud-save" / name).write_bytes(data)

          archive = Path("mods.zip")
          with ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Original mods.zip CRC failure: {bad}")
              names = zf.namelist()
              if "mods.js" not in names:
                  raise SystemExit("mods.zip has no root mods.js")
              if any(n == "cloud-save/" or n.startswith("cloud-save/") for n in names):
                  raise SystemExit("cloud-save already exists in mods.zip; refusing duplicate integration")
              original = zf.read("mods.js")

          bom = b"\xef\xbb\xbf" if original.startswith(b"\xef\xbb\xbf") else b""
          text = original.decode("utf-8-sig")
          enable = re.search(r"WML\.enable\s*\(\s*\[(.*?)\]\s*\)", text, re.S)
          if not enable or '"companions"' not in enable.group(1):
              raise SystemExit("Could not prove the expected WML.enable list")
          if re.search(r'(?m)^\s*["\']cloud-save["\']\s*,?\s*$', text):
              raise SystemExit("cloud-save already appears in mods.js")
          matches = list(re.finditer(r'(?m)^([ \t]*)(["\']companions["\'],)[ \t]*\r?$', text))
          if len(matches) != 1:
              raise SystemExit(f"Expected one companions entry, found {len(matches)}")
          m = matches[0]
          newline = "\r\n" if "\r\n" in text else "\n"
          replacement = m.group(1) + '"cloud-save",' + newline + m.group(0).rstrip("\r")
          updated = text[:m.start()] + replacement + text[m.end():]
          (stage / "mods.js").write_bytes(bom + updated.encode("utf-8"))

          if b"cloud-save" not in package["mod.js"]:
              raise SystemExit("0.6.3 mod.js does not identify cloud-save")
          if b"crypto.js" not in package["mod.js"]:
              raise SystemExit("0.6.3 mod.js does not load crypto.js")
          print("Staged CloudSave 0.6.3: " + ", ".join(sorted(package)))
          PY
          cp mods.zip /tmp/mods-before.zip
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi
          cd /tmp/cloudsave-stage
          zip -q -u "$GITHUB_WORKSPACE/mods.zip" mods.js cloud-save/mod.js cloud-save/crypto.js cloud-save/README.md cloud-save/INSTALL.txt
          cd "$GITHUB_WORKSPACE"
      - name: Verify archive integrity, exact payload, and minimal change
        run: |
          set -euo pipefail
          zip -T mods.zip
          node --check /tmp/cloudsave-stage/cloud-save/mod.js
          node --check /tmp/cloudsave-stage/cloud-save/crypto.js
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          from difflib import SequenceMatcher
          import re

          with ZipFile("/tmp/mods-before.zip") as old, ZipFile("mods.zip") as new:
              assert old.testzip() is None
              assert new.testzip() is None
              old_names, new_names = set(old.namelist()), set(new.namelist())
              assert old_names <= new_names, f"Removed entries: {sorted(old_names-new_names)}"
              added = new_names - old_names
              required = {
                  "cloud-save/mod.js",
                  "cloud-save/crypto.js",
                  "cloud-save/README.md",
                  "cloud-save/INSTALL.txt",
              }
              assert required <= added, f"Missing new files: {sorted(required-added)}"
              assert added <= required | {"cloud-save/"}, f"Unexpected added entries: {sorted(added-required)}"
              for name in old_names - {"mods.js"}:
                  assert old.read(name) == new.read(name), f"Existing mod changed: {name}"
              old_text = old.read("mods.js").decode("utf-8-sig").splitlines(keepends=True)
              new_text = new.read("mods.js").decode("utf-8-sig").splitlines(keepends=True)
              sm = SequenceMatcher(a=old_text, b=new_text)
              edits = [(tag, i1, i2, j1, j2) for tag, i1, i2, j1, j2 in sm.get_opcodes() if tag != "equal"]
              assert len(edits) == 1 and edits[0][0] == "insert", f"mods.js changes are not a single insertion: {edits}"
              _, _, _, j1, j2 = edits[0]
              assert len(new_text[j1:j2]) == 1 and re.fullmatch(r'[ \t]*"cloud-save",[ \t]*(?:\r?\n)?', new_text[j1]), new_text[j1:j2]
              contents = new.read("mods.js").decode("utf-8-sig")
              assert contents.count('"cloud-save"') == 1
              for name in required:
                  assert new.read(name) == (Path("/tmp/cloudsave-stage/cloud-save") / name).read_bytes()
              print(f"PASS: {len(old_names)} original entries preserved; {len(added)} CloudSave entries added; mods.js has one inserted enable line.")
          PY
          sha256sum mods.zip
      - name: Commit only the bundled release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods.zip
          git diff --cached --stat
          git commit -m "Bundle CloudSave 0.6.3 by default"
          git push origin HEAD:refs/heads/integrate/cloudsave-default-bundle
