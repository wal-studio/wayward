name: Generate role-based source map

on:
  push:
    paths:
      - "*.html"
  workflow_dispatch:
    inputs:
      source_html:
        description: 'Optional root HTML filename; select one when the branch contains multiple HTML files'
        required: false
        type: string
        default: ''
      include_legacy_mobile_targets:
        description: 'Include historical minified-symbol role rules only when explicitly requested'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  role-map:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve current source HTML
        shell: bash
        env:
          REQUESTED_SOURCE_HTML: ${{ inputs.source_html }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_html=""
          if [[ -n "$REQUESTED_SOURCE_HTML" ]]; then
            source_html="$REQUESTED_SOURCE_HTML"
            if [[ "$source_html" == */* || "${source_html,,}" != *.html || ! -f "$source_html" ]]; then
              echo "source_html must name an existing root-level .html file" >&2
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed_html < <(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA" -- '*.html' | awk 'index($0, "/") == 0' | sort -u)
            if [[ "${#changed_html[@]}" -eq 1 ]]; then
              source_html="${changed_html[0]}"
            elif [[ "${#changed_html[@]}" -gt 1 ]]; then
              printf 'Multiple root HTML sources changed; dispatch manually with source_html: %s\n' "${changed_html[*]}" >&2
              exit 1
            fi
          fi
          if [[ -n "$source_html" && ! -f "$source_html" ]]; then
            echo "Selected source HTML does not exist: $source_html" >&2
            exit 1
          fi
          if [[ -z "$source_html" ]]; then
            mapfile -t candidates < <(find . -maxdepth 1 -type f -iname '*.html' -printf '%f\n' | sort)
            if [[ "${#candidates[@]}" -ne 1 ]]; then
              printf 'Could not select one source HTML. Found %s candidates: %s. Use workflow_dispatch input source_html.\n' "${#candidates[@]}" "${candidates[*]}" >&2
              exit 1
            fi
            source_html="${candidates[0]}"
          fi
          echo "WAYWARD_SOURCE_HTML=$source_html" >> "$GITHUB_ENV"
          echo "Resolved source HTML: $source_html"

      - name: Build semantic role map
        run: |
          set -euo pipefail
          if [[ '${{ inputs.include_legacy_mobile_targets }}' == 'true' ]]; then
            python3 tools/build_role_map.py "$WAYWARD_SOURCE_HTML" analysis_parts/role_map --include-legacy-symbols
          else
            python3 tools/build_role_map.py "$WAYWARD_SOURCE_HTML" analysis_parts/role_map
          fi

      - name: Commit role map
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_parts/role_map
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh semantic source role map"
          git push
