name: Verify and package CloudSave 0.6.3

on:
  push:
    branches:
      - fix/cloudsave-063-native-auth-bridge-20261125
      - fix/cloudsave-save-summary-memo-20261126
      - work/cloudsave-native-display-20261126
      - work/cloudsave-unified-save-cards-20261126
    paths:
      - 'cloud-save/**'
      - 'scripts/test-cloudsave-063.cjs'
      - 'scripts/test-cloudsave-display-metadata.cjs'
      - 'scripts/forensic-native-save-display-scan.cjs'
      - '.github/workflows/cloudsave-063-ci.yml'
  pull_request:
    branches:
      - feat/cloudsave-062-auth-ux-performance-20261114
      - work/cloudsave-native-display-20261126
    paths:
      - 'cloud-save/**'
      - 'scripts/test-cloudsave-063.cjs'
      - 'scripts/test-cloudsave-display-metadata.cjs'
      - '.github/workflows/cloudsave-063-ci.yml'

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check cloud-save/mod.js
          node --check cloud-save/crypto.js
          node --check scripts/test-cloudsave-063.cjs
          node --check scripts/test-cloudsave-display-metadata.cjs
      - name: Verify native and browser authentication contracts
        run: node scripts/test-cloudsave-063.cjs
      - name: Verify native metadata preservation and memo UI
        run: node scripts/test-cloudsave-display-metadata.cjs
      - name: Scan pinned native game save-list source
        run: node scripts/forensic-native-save-display-scan.cjs
      - name: Verify diff and package
        run: |
          git diff --check e58c18c28e8ecf3daed809e3c8aee95e66a32c07...HEAD
          test -s cloud-save/mod.js
          test -s cloud-save/crypto.js
          test -s cloud-save/README.md
          test -s cloud-save/INSTALL.txt
          test "$(git rev-parse HEAD:cloud-save/crypto.js)" = "$(git rev-parse e58c18c28e8ecf3daed809e3c8aee95e66a32c07:cloud-save/crypto.js)"
          mkdir -p .build
          zip -X -j .build/Wayward_Google_Drive_CloudSave_v0.6.3.zip \
            cloud-save/mod.js cloud-save/crypto.js cloud-save/README.md cloud-save/INSTALL.txt
          unzip -t .build/Wayward_Google_Drive_CloudSave_v0.6.3.zip
          sha256sum .build/Wayward_Google_Drive_CloudSave_v0.6.3.zip > .build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Wayward-Google-Drive-CloudSave-v0.6.3
          path: |
            .build/Wayward_Google_Drive_CloudSave_v0.6.3.zip
            .build/SHA256SUMS.txt
