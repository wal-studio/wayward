name: Extract compact mobile patch contexts

on:
  workflow_dispatch:
    inputs:
      source_html:
        description: 'Root HTML filename; required when the branch contains multiple HTML files'
        required: false
        type: string
        default: ''
      include_legacy_mobile_targets:
        description: 'Run the historical minified-symbol context extractor'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  extract:
    if: inputs.include_legacy_mobile_targets == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve current source HTML
        shell: bash
        env:
          REQUESTED_SOURCE_HTML: ${{ inputs.source_html }}
        run: |
          set -euo pipefail
          source_html="$REQUESTED_SOURCE_HTML"
          if [[ -n "$source_html" ]]; then
            if [[ "$source_html" == */* || "${source_html,,}" != *.html || ! -f "$source_html" ]]; then
              echo "source_html must name an existing root-level .html file" >&2
              exit 1
            fi
          else
            mapfile -t candidates < <(find . -maxdepth 1 -type f -iname '*.html' -printf '%f\n' | sort)
            if [[ "${#candidates[@]}" -ne 1 ]]; then
              printf 'Select source_html explicitly; found %s candidates: %s\n' "${#candidates[@]}" "${candidates[*]}" >&2
              exit 1
            fi
            source_html="${candidates[0]}"
          fi
          echo "WAYWARD_SOURCE_HTML=$source_html" >> "$GITHUB_ENV"
          echo "Resolved source HTML: $source_html"

      - name: Extract small mobile patch contexts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          src = Path(os.environ["WAYWARD_SOURCE_HTML"])
          out = Path("analysis_parts/mobile_targets")
          out.mkdir(parents=True, exist_ok=True)
          raw = src.read_text(encoding="utf-8")

          def compact(s):
              return re.sub(r"\s+", " ", s or "").strip()

          def function_start(name, limit=9000):
              m = re.search(r"\bfunction\s+" + re.escape(name) + r"\s*\([^)]*\)\s*\{", raw)
              if not m:
                  return "NOT FOUND"
              return compact(raw[m.start():m.start()+limit])

          targets = ["nce", "Ihe", "vle", "zse", "The", "She", "whe"]
          parts = ["# Compact mobile patch contexts", ""]
          for name in targets:
              parts.append("## function " + name)
              parts.append(function_start(name))
              parts.append("")

          patterns = [
              ("debug toggle", r"wc2-toggle"),
              ("pointer events", r"setPointerCapture|releasePointerCapture|pointerdown|pointermove|pointerup"),
              ("mouse drag", r"mousedown|mousemove|mouseup"),
              ("touch events", r"touchstart|touchmove|touchend"),
              ("resize events", r"resize|ResizeObserver"),
              ("orientation", r"orientationchange"),
              ("map keywords", r"\bmap\b|지도|이동"),
              ("status keywords", r"status|상태"),
          ]

          for label, pat in patterns:
              parts.append("## " + label)
              matches = list(re.finditer(pat, raw, re.I))
              if not matches:
                  parts.append("NOT FOUND")
                  parts.append("")
                  continue
              for m in matches[:5]:
                  lo = max(0, m.start()-1800)
                  hi = min(len(raw), m.end()+3200)
                  line = raw.count("\n", 0, m.start()) + 1
                  parts.append("### line " + str(line))
                  parts.append(compact(raw[lo:hi]))
              parts.append("")

          target = out / "COMPACT_TARGETS.md"
          target.write_text("\n".join(parts) + "\n", encoding="utf-8")
          print("Wrote", target)
          PY

      - name: Commit compact contexts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_parts/mobile_targets/COMPACT_TARGETS.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh compact mobile patch contexts"
          git push
